<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | LYTA CAPITAL</title>
<meta name="description" content="LYTA CAPITALへのお問い合わせはこちらのフォームより承ります。">
<link rel="canonical" href="https://home.lyta-capital.com/contact/">
<link rel="alternate" hreflang="ja" href="https://home.lyta-capital.com/contact/">
<link rel="alternate" hreflang="en" href="https://home.lyta-capital.com/en/contact/">
<link rel="alternate" hreflang="x-default" href="https://home.lyta-capital.com/en/contact/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LYTA CAPITAL">
<meta property="og:title" content="Contact | LYTA CAPITAL">
<meta property="og:description" content="LYTA CAPITALへのお問い合わせ">
<meta property="og:url" content="https://home.lyta-capital.com/contact/">
<meta property="og:image" content="https://home.lyta-capital.com/img/ogp.png">
<meta property="og:locale" content="ja_JP">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="wordmark" href="/">LYTA CAPITAL</a>
    <nav class="site-nav">
      <div class="lang-switch">
        <span class="current">JP</span><span class="sep">・</span><a href="/en/contact/">EN</a>
      </div>
      <a class="nav-contact" href="/contact/">お問い合わせ</a>
    </nav>
  </div>
</header>

<main>

  <div class="page-hero">
    <h1 class="section-label reveal" style="margin-bottom: 0;">CONTACT</h1>
  </div>

  <div class="section" style="border-top: none; padding-top: 40px;">
    <div class="contact-wrap">
      <p class="contact-lead reveal">ご連絡は、以下のフォームより承ります。</p>

      <form id="contact-form" class="reveal">
        <div class="field">
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="company">ご所属</label>
          <input type="text" id="company" name="company" autocomplete="organization">
        </div>
        <div class="field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">メッセージ</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <input type="checkbox" name="botcheck" tabindex="-1" aria-hidden="true" style="display:none">
        <button type="submit" class="submit-btn">送信 / SEND</button>
        <p class="form-note">ご入力いただいた情報は、お問い合わせへの対応のみに利用します。</p>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </div>

</main>

<footer class="site-footer">
  <div class="inner">
    <span class="wordmark">LYTA CAPITAL</span>
    <p class="footer-tagline">For Japan's next century.</p>
    <div class="footer-meta">
      <span>&copy; LYTA CAPITAL, Inc.</span>
      <span>Tokyo</span>
      <a href="/contact/">お問い合わせ</a>
    </div>
    <p class="footer-legal">本ウェブサイトは情報提供のみを目的としており、有価証券その他の金融商品の取得の申込み・勧誘を行うものではありません。</p>
  </div>
</footer>

<script>
(function () {
  var els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    els.forEach(function (el) { io.observe(el); });
  } else {
    els.forEach(function (el) { el.classList.add('is-visible'); });
  }

  var W3F_ENDPOINT = 'https://api.web3forms.com/submit';
  var W3F_KEY = 'b16e7606-b2bd-410e-ac1d-c93893a0f113';

  var form = document.getElementById('contact-form');
  var status = document.getElementById('form-status');

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = form.name.value.trim();
    var company = form.company.value.trim();
    var email = form.email.value.trim();
    var message = form.message.value.trim();

    if (!name || !email || !message) {
      status.textContent = '必須項目（お名前・メールアドレス・メッセージ）をご入力ください。';
      return;
    }

    var btn = form.querySelector('.submit-btn');
    btn.disabled = true;
    status.textContent = '送信しています…';
    fetch(W3F_ENDPOINT, {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        access_key: W3F_KEY,
        subject: 'お問い合わせ: ' + name + (company ? ' (' + company + ')' : ''),
        from_name: 'LYTA CAPITAL Website',
        name: name,
        company: company,
        email: email,
        message: message,
        botcheck: form.botcheck.checked
      })
    }).then(function (res) { return res.json(); }).then(function (data) {
      btn.disabled = false;
      if (data.success) {
        form.reset();
        status.textContent = '送信しました。折り返しご連絡いたします。';
      } else {
        status.textContent = '送信に失敗しました。お手数ですが時間をおいて再度お試しください。';
      }
    }).catch(function () {
      btn.disabled = false;
      status.textContent = '送信に失敗しました。お手数ですが時間をおいて再度お試しください。';
    });
  });
})();
</script>

</body>
</html>
